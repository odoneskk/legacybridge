name: Compilar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o projeto do zip mais recente
        run: |
          ZIP=$(ls legacybridge*.zip | sort -V | tail -n1)
          echo "Usando $ZIP"
          unzip -q "$ZIP" -d projeto

      - name: Garantir plugin Java no runtime
        run: |
          python3 -c "
          path = 'projeto/legacybridge/runtime/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          if 'java' not in content:
              content = \"plugins { id 'java' }\n\" + content
          with open(path, 'w') as f:
              f.write(content)
          print('Ficheiro runtime/build.gradle atualizado com sucesso.')
          "

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Compilar o mod
        working-directory: projeto/legacybridge
        run: gradle :loader:build --no-daemon

      - name: Guardar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: legacybridge-mod
          path: projeto/legacybridge/loader/build/libs/legacybridge-*.jar
