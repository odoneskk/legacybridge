name: Compilar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo, para achar o zip adicionado por último

      - name: Extrair o projeto do zip mais recente
        run: |
          # Escolhe o zip pelo commit mais recente (e não pela ordem alfabética do nome)
          ZIP=$(for f in legacybridge*.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -n1 | cut -d' ' -f2-)
          echo "Usando $ZIP"
          unzip -q "$ZIP" -d projeto

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Compilar o mod
        working-directory: projeto/legacybridge
        run: gradle build --no-daemon --stacktrace

      - name: Guardar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: legacybridge-mod
          path: projeto/legacybridge/loader/build/libs/legacybridge-*.jar
          if-no-files-found: error
